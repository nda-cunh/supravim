stages:
  - test
  - deploy

tests:
  stage: test
  image: alpine:latest
  before_script:
    - apk add --no-cache vim
    - vim --version | sed -n 1p
  script:
    - ./test/run.sh
  rules:
    - changes:
        - vimrc.in
        - data/supravim/vim/**/*
        - test/**/*
        - .gitlab-ci.yml

pages:
  stage: deploy
  image: alpine:latest
  script:
    - cp -r site public
    # short install endpoints — one source of truth, no copy to keep in sync
    - cp install.sh public/install
    - cp create_package.sh public/build_package
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - site/**/*
        - install.sh
        - create_package.sh
        - .gitlab-ci.yml
